name: Publish update

# Builds app.asar on each OS/arch (Windows x64, macOS arm64 and Intel) and
# publishes the merged update.json plus the archives to the **`update` branch**,
# where installed apps read them. Nothing is committed to the default branch, so
# cloning the code never downloads a release's binaries. The same run builds and
# publishes the add-on archives (`docs/addon-architecture.md`).
# Run it by hand after bumping `version` in package.json. Nothing else needs
# raising: `scripts/runtime-descriptor.mjs` derives the runtime layer the archive
# needs (Electron + the unpacked Copilot payload) from the packaged output, and an
# install whose own layer differs is told to reinstall instead of swapping
# (`src/main/updates/runtime.ts`). A release that changes an add-on needs nothing
# extra either: the pins travel inside the new asar, and this run publishes the
# zips they name.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes shown in Settings -> Updates (optional)
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: win32-x64
            os: windows-latest
            target: --win --x64
          - name: darwin-arm64
            os: macos-latest
            target: --mac --arm64
          - name: darwin-x64
            os: macos-15-intel
            target: --mac --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Zips the add-ons from the artifacts `npm run build` just wrote (it does
      # not build them again), and the app build already generated the icons,
      # so electron-builder needs no separate `npm run icons` here.
      - run: npm run addons:zip
      - run: npx electron-builder --dir ${{ matrix.target }}
      - run: node scripts/package-update.mjs
      - name: Collect this platform's add-on catalogue
        shell: bash
        run: cp dist-addons/addons.json release/update/addons.${{ matrix.name }}.json
      # A JS add-on is platform-independent (`any`) and byte-identical on every
      # runner, so its archive is uploaded exactly once - by one matrix leg. The
      # other legs still publish their catalogue, which is what the merge step's
      # determinism check compares. Uploading the same-named `.zip` from all three
      # legs would collide under `download-artifact`'s `merge-multiple`.
      - name: Collect the platform-independent add-on archives
        if: matrix.name == 'win32-x64'
        shell: bash
        run: cp dist-addons/*.zip release/update/
      - uses: actions/upload-artifact@v6
        with:
          name: update-${{ matrix.name }}
          path: release/update/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: incoming
          merge-multiple: true
      - name: Merge manifests
        env:
          UPDATE_NOTES: ${{ inputs.notes }}
        run: node scripts/package-update.mjs --merge incoming
      - name: Merge add-on catalogues
        run: node scripts/merge-addons.mjs incoming
      # The distribution lives on its own branch and is rebuilt from scratch on
      # every release: one parentless commit holds exactly this release's files,
      # so it never accumulates archives and the code branch never carries them.
      # Being one commit also makes publishing atomic - no install can see an
      # `update.json` naming an add-on archive that is not there yet.
      - name: Publish the update branch
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp incoming/*.zip incoming/addons.json incoming/*.asar incoming/update.json "$staging/"
          # Keep the branch equal to the catalogue: the app resolves every add-on
          # download through `addons.json`, so an archive it does not name is
          # unreachable dead weight (34 MB each).
          node - "$staging" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = process.argv[2];
          const catalog = JSON.parse(fs.readFileSync(path.join(directory, 'addons.json'), 'utf8'));
          const keep = new Set();
          for (const identities of Object.values(catalog.addons ?? {}))
            for (const entry of Object.values(identities))
              for (const archive of Object.values(entry.platforms ?? {})) keep.add(archive.file);
          for (const file of fs.readdirSync(directory))
            if (file.endsWith('.zip') && !keep.has(file)) fs.rmSync(path.join(directory, file));
          NODE
          # A commit with no parent, built from the staging folder and pushed by
          # object id: nothing is checked out or committed in the working tree, so
          # the branch is replaced however it was before.
          index="$(mktemp -d)/index"
          git_dir="$(git rev-parse --absolute-git-dir)"
          version="$(node -p "require('./incoming/update.json').version")"
          (
            cd "$staging"
            GIT_DIR="$git_dir" GIT_WORK_TREE="$staging" GIT_INDEX_FILE="$index" git add --all .
          )
          tree="$(GIT_DIR="$git_dir" GIT_INDEX_FILE="$index" git write-tree)"
          export GIT_AUTHOR_NAME=github-actions GIT_AUTHOR_EMAIL=github-actions@users.noreply.github.com
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit="$(GIT_DIR="$git_dir" git commit-tree "$tree" -m "Publish update $version")"
          git push --force origin "$commit:refs/heads/update"
