name: Publish update

# Builds app.asar on each OS/arch (Windows x64, macOS arm64 and Intel) and commits the merged update.json plus the archives
# to update/ on the default branch, where installed apps read them. Run it by
# hand after bumping `version` in package.json. If a release changes native
# dependencies or the Electron version, bump `updates.runtimeGeneration` too, so
# older installs are told to reinstall instead of loading an incompatible asar.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes shown in Settings -> Updates (optional)
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: win32-x64
            os: windows-latest
            target: --win --x64
          - name: darwin-arm64
            os: macos-latest
            target: --mac --arm64
          - name: darwin-x64
            os: macos-15-intel
            target: --mac --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run icons
      - run: npx electron-builder --dir ${{ matrix.target }}
      - run: node scripts/package-update.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.name }}
          path: release/update/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming
          merge-multiple: true
      - name: Merge manifests
        env:
          UPDATE_NOTES: ${{ inputs.notes }}
        run: node scripts/package-update.mjs --merge incoming
      - name: Commit update/
        run: |
          rm -rf update
          mkdir update
          cp incoming/app-*.asar incoming/update.json update/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add update
          git commit -m "Publish update" || echo "Nothing to publish"
          git push
