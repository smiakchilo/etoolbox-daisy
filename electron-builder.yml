appId: com.etoolboxdaisy.app
productName: EToolbox Daisy
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  # The application's own data (the bundled skills, the model-facing rules, the
  # icons) ships inside the asar.
  - resources/**/*
  # Add-ons are not packed into the asar: they are built from the same source
  # (`scripts/build-addons.mjs`) and `scripts/app-build.mjs` copies them to
  # `resources/addons`, where the loader imports them from real files.
  - '!out/addons/**'
  - '!src/addons/**'
  # The Copilot CLI packages (`copilot.exe`, 138 MB) are devDependencies, so they
  # are not packaged at all; the agent resolves its own sign-in CLI at run time
  # (`src/agents/copilot/cli/`). The agent session still runs against the SDK
  # package's `copilot-runtime.exe`.
  #
  # The SDK's platform package ships payload this app never uses: src/agents/copilot
  # only ever spawns copilot-runtime.exe (via the explicit-path RuntimeConnection,
  # see runtimePaths.ts/copilotClient.ts). Everything below is dead weight for
  # that one entry point - the `plugins/computer-use` MCP plugin, the bundled
  # `ripgrep`/`tgrep` search binaries (the hardened tool policy in toolPolicy.ts
  # never allows any tool that would shell out to them), and the
  # `builtin-skills` markdown payload (enableSkills is forced off outside the
  # one-off skill test noted in requirements-decisions.md).
  # Trimmed after confirming empirically (docs/verification.md Step 02) that
  # tests/integration/agent-runtime.test.ts-equivalent behavior still passes
  # against the packaged output with these patterns applied.
  - '!node_modules/@github/copilot-sdk-win32-x64/plugins/**'
  - '!node_modules/@github/copilot-sdk-win32-x64/ripgrep/**'
  - '!node_modules/@github/copilot-sdk-win32-x64/tgrep/**'
  - '!node_modules/@github/copilot-sdk-win32-x64/builtin-skills/**'
  # The macOS equivalents of the same dead weight (darwin packages have no
  # OneAuth/msal payload).
  - '!node_modules/@github/copilot-sdk-darwin-*/{plugins,ripgrep,tgrep,builtin-skills}/**'
  # MSAL / OneAuth are Microsoft identity-broker binaries. This app only ever
  # authenticates a GitHub account via the CLI's OAuth web flow, and the resulting credential is stored through the
  # Windows Credential Manager (wincred/keytar), not through OneAuth. Verified
  # empirically (U6, docs/verification.md Step 02): with all six files renamed
  # away, reading an existing credential still reports
  # `isAuthenticated: true, authType: "user"`, and a fresh login still succeeds
  # AND still writes a real vault entry with no plaintext fallback.
  - '!node_modules/@github/copilot-sdk-win32-x64/prebuilds/win32-x64/OneAuthInterop.*'
  - '!node_modules/@github/copilot-sdk-win32-x64/prebuilds/win32-x64/msalruntime.dll'
  - '!node_modules/@github/copilot-sdk-win32-x64/prebuilds/win32-x64/msal-node-runtime.node'
# The SDK's `copilot-runtime.exe` (and its .node/.dll dependencies) must be real
# files on disk to be spawned/dlopen'd - they cannot be loaded from inside the
# asar archive. electron-builder's default heuristic already auto-detects and
# unpacks packages containing native modules, but this is made explicit per
# the Step 02 requirement instead of relying on that implicit behavior. The
# Copilot CLI packages are not packaged at all (see `files` above).
asarUnpack:
  - node_modules/@github/copilot-sdk-win32-x64/**
  - node_modules/@github/copilot-sdk-darwin-*/**
# No `extraResources`: the bundled skills/rules/icons live in the archive. The
# unpacked agent runtime above is the one deliberate exception - it must be real
# files on disk.
win:
  # `resources/icon.png` is the single source of truth. `resources/icon.ico`
  # (this field, and the file the app reads for its window/taskbar icon at
  # runtime via `src/main/appIcon.ts`) and `resources/icon.icns` (below) are
  # generated from it by `scripts/generate-icons.mjs` (`npm run icons`, run by
  # `build`/`dev`/`package:*`) and are git-ignored.
  icon: resources/icon.ico
  target:
    - target: zip
      arch:
        - x64
mac:
  # macOS needs .icns; without this electron-builder looks for
  # build/icon.icns, finds nothing and ships Electron's default icon.
  # resources/icon.icns is generated from resources/icon.png at build time.
  icon: resources/icon.icns
  target:
    - target: zip
      arch:
        - x64
        - arm64
publish: null
